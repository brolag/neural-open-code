name: Validate Plugin

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run supported test suite
        run: python -m pytest -q
      - name: Run hook unit tests
        run: node --test tests/hooks.test.js
      - name: Validate plugin documentation
        run: ./scripts/doc-lint.sh
